name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Build and test both site variants:
        # - "full":      the complete travel log, every photo visible
        # - "portfolio": the public book site, which hides every photo
        #                tagged `family: true`.
        # The two variants share the same code; only NEXT_PUBLIC_VARIANT
        # differs, so a regression in the family filter only surfaces here.
        variant: [full, portfolio]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: "package.json"
          cache: 'npm'

      - name: Garantit npm >= 11.10
        # min-release-age (quarantaine des versions fraichement publiees) n'existe
        # qu'a partir de npm 11.10. Node 24.14+ l'embarque, Node 22 et 20 non.
        # Cette etape echoue si le runner regresse en deca, plutot que de laisser
        # la protection disparaitre en silence.
        run: |
          v=$(npm --version)
          echo "npm $v"
          major=${v%%.*}; rest=${v#*.}; minor=${rest%%.*}
          if [ "$major" -lt 11 ] || { [ "$major" -eq 11 ] && [ "$minor" -lt 10 ]; }; then
            echo "::error::npm $v < 11.10, min-release-age indisponible."
            exit 1
          fi

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
        env:
          NEXT_PUBLIC_VARIANT: ${{ matrix.variant }}

      - name: Build (${{ matrix.variant }})
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_VARIANT: ${{ matrix.variant }}

  # Merge automatique au vert : PR de l'owner ou de Dependabot (tous types de
  # mises à jour, majors comprises). Remplace l'auto-merge natif GitHub.
  auto-merge:
    name: auto-merge
    needs: checks
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      (github.event.pull_request.user.login == github.repository_owner ||
       github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verifie l'absence de flag de relecture
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
               --json labels --jq '.labels[].name' | grep -qx 'review-required'; then
            echo "hold=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR flaguee review-required, auto-merge suspendu."
          else
            echo "hold=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Squash-merge la PR et supprime la branche
        if: steps.gate.outputs.hold != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr merge ${{ github.event.pull_request.number }}
          --squash --delete-branch --repo ${{ github.repository }}
